[package]
name = "aquaflux"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "aquaflux_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["py-clone"] }
polars = { version = "*", features = ["lazy", "dtype-full"]}
pyo3-polars = { version = "0.28" }
